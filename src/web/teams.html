<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMTP2Graph</title>
<style nonce="__NONCE__">
:root { --bg: #ffffff; --text: #242424; --muted: #616161; --accent: #5b5fc7; }
@media (prefers-color-scheme: dark) { :root { --bg: #1f1f1f; --text: #ffffff; --muted: #adadad; --accent: #7f85f5; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
main { max-width: 32rem; margin: 12vh auto; padding: 0 1rem; text-align: center; }
h1 { font-size: 20px; }
p { color: var(--muted); }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
a.btn { display: inline-block; padding: 8px 16px; border-radius: 4px; text-decoration: none; border: 1px solid var(--accent); color: var(--accent); }
a.btn.primary { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
    <h1>SMTP2Graph</h1>
    <p>Fehlgeschlagene Mails, Suche und Statistik finden Sie in der Weboberfläche. Sie öffnet sich im Browser und erfordert eine Anmeldung.</p>
    <div class="btns">
        <a class="btn primary" href="__PUBLIC_URL__/#status=failed" target="_blank" rel="noopener">Fehlgeschlagene Mails öffnen</a>
        <a class="btn" href="__PUBLIC_URL__/#tab=stats" target="_blank" rel="noopener">Übersicht öffnen</a>
    </div>
</main>
</body>
</html>
